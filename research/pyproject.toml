[project]
name = "ashare-research"
version = "0.1.0"
description = "Point-in-time A-share ML research, shadow evaluation and model promotion"
requires-python = ">=3.11,<3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "evidently>=0.7.21,<0.8",
  "lightgbm>=4.6,<5",
  "mlflow>=3.1,<4",
  "numpy>=1.26,<3",
  "optuna>=4.8,<5",
  "pandas>=2.2,<3",
  "polars>=1.30,<2",
  "pyarrow>=20,<24",
  "pyqlib==0.9.7",
  "python-dotenv>=1.1,<2",
  "scikit-learn>=1.6,<2",
  "tushare>=1.4.29,<2",
]

[project.scripts]
ashare-research = "ashare_research.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ashare_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
