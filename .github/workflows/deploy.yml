name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only deploy after CI passes.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Wait for CI to pass on the same commit.
    needs: []
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/ashare-pilot' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            echo "[deploy] Pulling latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "[deploy] Rebuilding containers..."
            docker compose build --pull
            docker compose up -d --remove-orphans

            echo "[deploy] Waiting for health check..."
            sleep 10
            docker compose ps

            echo "[deploy] Done at $(date '+%Y-%m-%d %H:%M:%S %Z')"
