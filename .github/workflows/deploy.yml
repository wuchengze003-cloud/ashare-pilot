name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Only deploy when CI passed (or manual dispatch).
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/ashare-pilot' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            echo "[deploy] Pulling latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "[deploy] Rebuilding containers..."
            docker compose build --pull
            docker compose up -d --remove-orphans

            echo "[deploy] Health check..."
            for i in $(seq 1 12); do
              if curl -fsS "http://127.0.0.1:3100/api/strategies" > /dev/null 2>&1; then
                echo "[deploy] Health check passed."
                break
              fi
              if [ "$i" = 12 ]; then
                echo "[deploy] Health check FAILED after 60s."
                docker compose ps
                exit 1
              fi
              sleep 5
            done

            echo "[deploy] Done at $(date '+%Y-%m-%d %H:%M:%S %Z')"
